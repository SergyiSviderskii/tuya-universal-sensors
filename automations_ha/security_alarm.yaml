- id: ''
  alias: Объединенная тревога по времени
  description: 'Автоматизация посылки уведомления по времени датчиков leak water, проверяет 
                когда нужно активировать устройство
                (датчики leak-water tuya -> esphome) для проверки батареи и смены даты'
  triggers:
  - trigger: time
    at: '09:00:00'
  - trigger: time
    at: '15:00:00'    
  - trigger: time
    at: '21:00:00'   
  condition: []
  action: 
    actions:
      # --- Проверка батареи датчиков (каждый триггер) ---
      - repeat:
          for_each:
            - sensor.dom_vannaia_umyvalnik_utechka_vody_batareia_proverialas
            - sensor.dom_vannaia_unitaz_utechka_vody_batareia_proverialas
            - sensor.dom_kukhnia_moika_utechka_vody_batareia_proverialas
            - sensor.dom_letniaia_kukhnia_moika_utechka_vody_batareia_proverialas
          sequence:
            - if:
                - condition: template
                  value_template: >-                        
                    {# Проверяем, что датчик вообще имеет валидное значение #}
                    {% if has_value(repeat.item) %}
                      {# Исправлено: убрали лишний .state из вызова #}
                      {% set last_check = as_timestamp(states(repeat.item)) %}
                      {% set now_ts = as_timestamp(now()) %}
                      {{ (now_ts - last_check) >= 31536000 }}                        
                    {% else %}
                      false
                    {% endif %}                
              then:
                - action: script.notify_message
                  metadata: {}
                  data:
                    title: "🔋 Проверка батареи — {{ state_attr(repeat.item, 'friendly_name') }}"
                    message: |
                      ⚠️ Срок проверки истёк, сбросьте датчик
                      📍 Комната: {{ area_name(repeat.item) | default('Не указана', true) }}
                      🕒 Время: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

    mode: single

    
